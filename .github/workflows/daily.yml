name: Daily update
# Fetches new papers every morning (06:00 China time) and commits the data.
# New papers still get best-effort abstracts (Crossref -> OpenAlex -> publisher);
# the larger backlog top-up is OFF here -- run the backfill manually for that.
# Also runnable anytime via the "Run workflow" button.
#
# NOTE: the commit step stages data/ AND the generated plain*.html pages.
# make_plain.py writes those to the repo ROOT (next to index.html), so a
# "git add data/" alone would silently drop them and the pages would 404.
on:
  schedule:
    - cron: "0 22 * * *"     # 22:00 UTC = 06:00 China time (UTC+8)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run daily aggregate (new papers only)
        env:
          OPENALEX_KEY: ${{ secrets.OPENALEX_KEY }}
        run: python aggregate.py
      - name: Build static (no-JS) pages
        run: python -u make_plain.py
      - name: Show generated files
        if: always()
        run: ls -la plain*.html || echo "!! no plain*.html generated"
      - name: Commit data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Daily update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $i."
              exit 0
            fi
            echo "Push rejected (remote moved); rebasing and retrying..."
            git pull --rebase --autostash || { echo "Rebase failed."; exit 1; }
          done
          echo "Could not push after 3 attempts."
          exit 1
